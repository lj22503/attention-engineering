<!-- 导航栏 -->
<nav class="nav">
  <div class="nav-container">
    <div class="nav-logo">
      <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
        <span class="nav-emoji">⚓</span>
        <span class="nav-title">万有注意力</span>

    <div class="nav-links">

      <a href="knowledge.html" class="nav-link">知识库</a>
    </div>
  </div>
</nav>

<!-- 场景库主体 -->
<main class="scenarios-page">
  <div class="scenarios-container">
    
    <!-- 页面标题 -->
    <div class="page-header">
      <h1>场景库 · Scenarios</h1>
      <p class="page-subtitle">14 大场景预设方案，直接套用或自定义</p>
    </div>
    
    <!-- 场景切换 Tab -->
    <div class="scenario-tabs">
      <button class="scenario-tab active" data-type="get">
        <span class="tab-icon">🎯</span>
        <span class="tab-title">获取注意力</span>
        <span class="tab-count">8 个场景</span>
      </button>
      <button class="scenario-tab" data-type="protect">
        <span class="tab-icon">🛡️</span>
        <span class="tab-title">保护注意力</span>
        <span class="tab-count">6 个场景</span>
      </button>
    </div>
    
    <!-- 获取注意力场景 -->
    <div class="scenario-grid active" id="scenario-get">
      <!-- 场景卡片由 JS 动态生成 -->
    </div>
    
    <!-- 保护注意力场景 -->
    <div class="scenario-grid" id="scenario-protect">
      <!-- 场景卡片由 JS 动态生成 -->
    </div>
    
    <!-- 场景详情弹窗 -->
    <div class="modal-overlay" id="modal-overlay" style="display: none;">
      <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">×</button>
        <div class="modal-body" id="modal-body">
          <!-- 动态加载场景详情 -->
        </div>
      </div>
    </div>
    
  </div>
</main>

<!-- 页面底部 -->

  <div class="footer-container">
