<!-- 工作台主体 -->
<main class="workbench">
  <div class="workbench-container">
    
    <!-- 页面标题 -->
    <div class="workbench-header">
      <h1>注意空间 · Attention Space</h1>
      <p class="workbench-subtitle">输入你的目标，生成专属注意力方案</p>
    </div>
    
    <!-- 引擎切换 Tab -->
    <div class="engine-tabs">
      <button class="engine-tab active" data-engine="get">
        <span class="tab-icon">🎯</span>
        <span class="tab-title">获取注意力</span>
        <span class="tab-desc">创作者 / 产品经理 / 运营</span>
      </button>
      <button class="engine-tab" data-engine="protect">
        <span class="tab-icon">🛡️</span>
        <span class="tab-title">保护注意力</span>
        <span class="tab-desc">个人用户 / 信息焦虑</span>
      </button>
    </div>
    
    <!-- 获取注意力引擎 -->
    <div class="engine-panel active" id="engine-get">
      <div class="panel-grid">
        <!-- 输入区 -->
        <div class="input-section">
          <h2 class="section-heading">你的目标用户是谁？</h2>
          
          <div class="form-group">
            <label for="target-user">目标用户描述 <span class="required">*</span></label>
            <textarea id="target-user" class="form-textarea" rows="4" placeholder="例如：25-35 岁职场人，想理财但不懂投资，经常焦虑但不知道如何行动"></textarea>
          </div>
          
          <div class="form-group">
            <label for="scenario">场景类型（可选）</label>
            <select id="scenario" class="form-select">
              <option value="">请选择场景</option>
              <option value="wechat">公众号创作者</option>
              <option value="xiaohongshu">小红书创作者</option>
              <option value="knowledge">知识付费</option>
              <option value="ecommerce">电商决策</option>
              <option value="finance">金融投资</option>
              <option value="social">社交社群</option>
              <option value="health">健康习惯</option>
              <option value="saas">SaaS 工具</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="product">你的产品形态（可选）</label>
            <input type="text" id="product" class="form-input" placeholder="例如：基金定投付费社群">
          </div>
          
          <div class="form-group">
            <label for="goal">核心目标（可选）</label>
            <input type="text" id="goal" class="form-input" placeholder="例如：获客→经营→服务→留存">
          </div>
          
          <button class="btn-generate" onclick="generatePlan('get')">
            <span class="btn-icon">✨</span>
            生成方案
          </button>
        </div>
        
        <!-- 输出区 -->
        <div class="output-section">
          <div class="output-placeholder" id="output-placeholder-get">
            <div class="placeholder-icon">📝</div>
            <div class="placeholder-text">填写左侧表单，点击"生成方案"</div>
            <div class="placeholder-hint">AI 将为你生成定制化的四子系统方案</div>
          </div>
          
          <div class="output-content" id="output-content-get" style="display: none;">
            <!-- 动态生成内容将在这里 -->
          </div>
        </div>
      </div>
    </div>
    
    <!-- 保护注意力引擎 -->
    <div class="engine-panel" id="engine-protect">
      <div class="panel-grid">
        <!-- 输入区 -->
        <div class="input-section">
          <h2 class="section-heading">你的注意力现状？</h2>
          
          <div class="form-group">
            <label>每天刷手机几小时？ <span class="required">*</span></label>
            <div class="radio-group">
              <label class="radio-option"><input type="radio" name="screen-time" value="0-2"> &lt;2h</label>
              <label class="radio-option"><input type="radio" name="screen-time" value="2-4"> 2-4h</label>
              <label class="radio-option"><input type="radio" name="screen-time" value="4-6" checked> 4-6h</label>
              <label class="radio-option"><input type="radio" name="screen-time" value="6+"> 6h+</label>
            </div>
          </div>
          
          <div class="form-group">
            <label>什么信息让你焦虑？（可多选）</label>
            <div class="checkbox-group">
              <label class="checkbox-option"><input type="checkbox" name="anxiety" value="stocks"> 股市波动</label>
              <label class="checkbox-option"><input type="checkbox" name="anxiety" value="news"> 行业新闻</label>
              <label class="checkbox-option"><input type="checkbox" name="anxiety" value="others"> 别人赚钱</label>
              <label class="checkbox-option"><input type="checkbox" name="anxiety" value="ai"> AI 焦虑</label>
              <label class="checkbox-option"><input type="checkbox" name="anxiety" value="fomo"> 怕错过信息</label>
            </div>
          </div>
          
          <div class="form-group">
            <label for="focus-problem">想专注但做不到的事？</label>
            <textarea id="focus-problem" class="form-textarea" rows="3" placeholder="例如：想深度阅读，但总是被推送打断"></textarea>
          </div>
          
          <button class="btn-generate" onclick="generatePlan('protect')">
            <span class="btn-icon">✨</span>
            生成方案
          </button>
        </div>
        
        <!-- 输出区 -->
        <div class="output-section">
          <div class="output-placeholder" id="output-placeholder-protect">
            <div class="placeholder-icon">📝</div>
            <div class="placeholder-text">填写左侧表单，点击"生成方案"</div>
            <div class="placeholder-hint">AI 将为你生成个人注意力保护方案</div>
          </div>
          
          <div class="output-content" id="output-content-protect" style="display: none;">
            <!-- 动态生成内容将在这里 -->
          </div>
        </div>
      </div>
    </div>
    
    <!-- 历史方案 -->
    <div class="history-section">
      <h2 class="section-heading">历史方案</h2>
      <div class="history-list" id="history-list">
        <div class="history-empty">暂无历史方案</div>
      </div>
    </div>
    
  </div>
</main>
